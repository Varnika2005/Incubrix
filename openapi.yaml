openapi: 3.1.0
info:
  title: ClipPilot AI
  description: Prompt-to-Video Editing Studio Engine — IncuBrix Container Integration
  version: 1.0.0
paths:
  /health:
    get:
      tags:
      - Health
      summary: Health Check
      description: 'Liveness probe: reports whether the service process is alive.'
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /ready:
    get:
      tags:
      - Health
      summary: Readiness Check
      description: 'Readiness probe: verifies essential dependencies are functional:

        - Database connection

        - Storage directories writable

        - FFmpeg executable available

        - S3 / MinIO connectivity if enabled'
      operationId: readiness_check_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/auth/signup:
    post:
      tags:
      - Auth
      summary: Signup
      description: Register a new user account with validated credentials and hashed
        password.
      operationId: signup_api_v1_auth_signup_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: Login
      description: 'Authenticate user with email and password, returning JWT token
        and setting session cookie.

        Enforces rate limiting to prevent brute-force attacks.'
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/me:
    get:
      tags:
      - Auth
      summary: Get Me
      description: Retrieve authenticated user profile.
      operationId: get_me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
      security:
      - HTTPBearer: []
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      summary: Logout
      description: Sign out user and clear authentication cookie.
      operationId: logout_api_v1_auth_logout_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/health:
    get:
      tags:
      - Health
      summary: Health Check
      description: 'Liveness probe: reports whether the service process is alive.'
      operationId: health_check_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/ready:
    get:
      tags:
      - Health
      summary: Readiness Check
      description: 'Readiness probe: verifies essential dependencies are functional:

        - Database connection

        - Storage directories writable

        - FFmpeg executable available

        - S3 / MinIO connectivity if enabled'
      operationId: readiness_check_api_v1_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/capabilities:
    get:
      tags:
      - Capabilities
      summary: Get Capabilities
      operationId: get_capabilities_api_v1_capabilities_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemCapabilities'
  /api/v1/jobs/upload:
    post:
      tags:
      - Jobs
      summary: Upload Video
      operationId: upload_video_api_v1_jobs_upload_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_video_api_v1_jobs_upload_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/jobs/url:
    post:
      tags:
      - Jobs
      summary: Create Job From Url
      description: 'IncuBrix Validated Media URL Ingestion.

        Downloads remote media safely with SSRF protection against private, loopback,

        and link-local network destinations including redirects.'
      operationId: create_job_from_url_api_v1_jobs_url_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUrlJobRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/jobs/demo:
    post:
      tags:
      - Jobs
      summary: Create Demo Job
      description: '1-Click Reproducible Demo Endpoint.

        Uses bundled synthetic sample asset, associates with current user if logged
        in,

        or tags as demo for safe public evaluation.

        Calculates immutable source SHA-256 hash immediately upon import.'
      operationId: create_demo_job_api_v1_jobs_demo_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
      security:
      - HTTPBearer: []
  /api/v1/jobs/{job_id}/analyze:
    post:
      tags:
      - Jobs
      summary: Analyze Prompt
      operationId: analyze_prompt_api_v1_jobs__job_id__analyze_post
      security:
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzePromptRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}/process:
    post:
      tags:
      - Jobs
      summary: Process Job
      operationId: process_job_api_v1_jobs__job_id__process_post
      security:
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessJobRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}:
    get:
      tags:
      - Jobs
      summary: Get Job
      operationId: get_job_api_v1_jobs__job_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Jobs
      summary: Delete Job
      description: 'Deletes a job and its associated media files on disk.

        Strictly restricted to the authoritative project owner.'
      operationId: delete_job_api_v1_jobs__job_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs:
    get:
      tags:
      - Jobs
      summary: List Jobs
      description: List jobs strictly belonging to the authenticated user.
      operationId: list_jobs_api_v1_jobs_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/JobResponse'
                type: array
                title: Response List Jobs Api V1 Jobs Get
      security:
      - HTTPBearer: []
  /api/v1/jobs/{job_id}/preview/original:
    get:
      tags:
      - Jobs
      summary: Preview Original
      operationId: preview_original_api_v1_jobs__job_id__preview_original_get
      security:
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}/preview/output:
    get:
      tags:
      - Jobs
      summary: Preview Output
      operationId: preview_output_api_v1_jobs__job_id__preview_output_get
      security:
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}/download:
    head:
      tags:
      - Jobs
      summary: Download Output
      operationId: download_output_api_v1_jobs__job_id__download_head
      security:
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: filename
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Filename
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Jobs
      summary: Download Output
      operationId: download_output_api_v1_jobs__job_id__download_head
      security:
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: filename
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Filename
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}/receipt:
    get:
      tags:
      - Jobs
      summary: Get Receipt
      operationId: get_receipt_api_v1_jobs__job_id__receipt_get
      security:
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditReceipt'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}/manifest:
    get:
      tags:
      - Jobs
      summary: Get Job Manifest
      description: 'IncuBrix Output Manifest Retrieval.

        Returns downloadable structured JSON manifest containing model, engine,

        effective settings, hashes, timings, and rights details.'
      operationId: get_job_manifest_api_v1_jobs__job_id__manifest_get
      security:
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}/verify-integrity:
    get:
      tags:
      - Jobs
      summary: Verify Job Integrity
      description: 'Verifies that the original uploaded source video on disk remains
        100% byte-for-byte identical

        to the hash calculated upon initial import.'
      operationId: verify_job_integrity_api_v1_jobs__job_id__verify_integrity_get
      security:
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrityVerificationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}/history:
    post:
      tags:
      - Jobs
      summary: Save Job History
      description: 'Persists the Edit Decision List (EDL) / undo-redo history stack
        in the database.

        Never modifies the original media file.'
      operationId: save_job_history_api_v1_jobs__job_id__history_post
      security:
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveHistoryRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Jobs
      summary: Get Job History
      description: Returns the complete non-destructive edit history stack, current
        index, and navigation flags.
      operationId: get_job_history_api_v1_jobs__job_id__history_get
      security:
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryStackResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}/undo:
    post:
      tags:
      - Jobs
      summary: Undo Job Edit
      description: 'Feature 6: Complete Undo.

        Restores the previous edit state, preserving original media and canonical
        timeline consistency.'
      operationId: undo_job_edit_api_v1_jobs__job_id__undo_post
      security:
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UndoRedoResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}/redo:
    post:
      tags:
      - Jobs
      summary: Redo Job Edit
      description: 'Feature 6: Complete Redo.

        Reapplies the next edit state from the redo stack.'
      operationId: redo_job_edit_api_v1_jobs__job_id__redo_post
      security:
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UndoRedoResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}/timeline:
    get:
      tags:
      - Jobs
      summary: Get Job Timeline
      description: 'Returns the Content-Aware Timeline model for the job, including
        segments,

        content-anchored source effects, and transformed timeline positions.'
      operationId: get_job_timeline_api_v1_jobs__job_id__timeline_get
      security:
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}/timeline/effects:
    post:
      tags:
      - Jobs
      summary: Add Timeline Effect
      description: 'Anchors a new content-aware effect (caption, mute, beep, visual_effect)

        to immutable source media timestamps.'
      operationId: add_timeline_effect_api_v1_jobs__job_id__timeline_effects_post
      security:
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddTimelineEffectRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}/timeline/transform:
    post:
      tags:
      - Jobs
      summary: Transform Timeline
      description: 'Applies timeline transformations (cut, speed, reorder, trim_start,
        trim_end, time_slice)

        and deterministically transforms all content-anchored effects according to
        documented policy.'
      operationId: transform_timeline_api_v1_jobs__job_id__timeline_transform_post
      security:
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransformTimelineRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}/timeline/map:
    post:
      tags:
      - Jobs
      summary: Map Timeline Coordinates
      description: 'Deterministic bi-directional coordinate mapping:

        - Given source_time: returns all corresponding timeline timestamps.

        - Given timeline_time: returns active segment and source timestamp.'
      operationId: map_timeline_coordinates_api_v1_jobs__job_id__timeline_map_post
      security:
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimelineMapRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineMapResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}/instruction:
    post:
      tags:
      - Jobs
      summary: Process Single Instruction
      description: 'Central Operation-Processing Layer (Must-Have 3 & Feature 7).

        Strict 3-way response system for every editing instruction with consistent
        timestamp policy:

        - APPLIED: Validated, executed, and committed to timeline.

        - NEEDS_CLARIFICATION: Ambiguous or missing parameters. Specific question
        returned, timeline untouched.

        - REJECTED: Unsupported, invalid, unsafe, or impossible. Clear reason returned,
        timeline untouched.'
      operationId: process_single_instruction_api_v1_jobs__job_id__instruction_post
      security:
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessInstructionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstructionOutcome'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/signup:
    post:
      tags:
      - Auth
      summary: Signup
      description: Register a new user account with validated credentials and hashed
        password.
      operationId: signup_api_auth_signup_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/login:
    post:
      tags:
      - Auth
      summary: Login
      description: 'Authenticate user with email and password, returning JWT token
        and setting session cookie.

        Enforces rate limiting to prevent brute-force attacks.'
      operationId: login_api_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/me:
    get:
      tags:
      - Auth
      summary: Get Me
      description: Retrieve authenticated user profile.
      operationId: get_me_api_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
      security:
      - HTTPBearer: []
  /api/auth/logout:
    post:
      tags:
      - Auth
      summary: Logout
      description: Sign out user and clear authentication cookie.
      operationId: logout_api_auth_logout_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/health:
    get:
      tags:
      - Health
