components:
  schemas:
    AddTimelineEffectRequest:
      properties:
        type:
          type: string
          title: Type
          description: 'Effect type: caption, mute, beep, visual_effect, color_adjust'
        source_start:
          type: number
          minimum: 0.0
          title: Source Start
          description: Anchor start timestamp in source media
        source_end:
          type: number
          minimum: 0.0
          title: Source End
          description: Anchor end timestamp in source media
        parameters:
          additionalProperties: true
          type: object
          title: Parameters
          description: Effect parameters like text, style, freq, etc.
        label:
          anyOf:
          - type: string
          - type: 'null'
          title: Label
      type: object
      required:
      - type
      - source_start
      - source_end
      title: AddTimelineEffectRequest
    AnalyzePromptRequest:
      properties:
        prompt:
          type: string
          maxLength: 1000
          minLength: 1
          title: Prompt
          description: Natural language editing instruction
      type: object
      required:
      - prompt
      title: AnalyzePromptRequest
    Body_upload_video_api_jobs_upload_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
        callback_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Callback Url
      type: object
      required:
      - file
      title: Body_upload_video_api_jobs_upload_post
    Body_upload_video_api_v1_jobs_upload_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
        callback_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Callback Url
      type: object
      required:
      - file
      title: Body_upload_video_api_v1_jobs_upload_post
    CreateUrlJobRequest:
      properties:
        url:
          type: string
          title: Url
          description: Public HTTP/HTTPS media URL to safely ingest
        prompt:
          anyOf:
          - type: string
          - type: 'null'
          title: Prompt
          description: Optional editing instruction prompt
        callback_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Callback Url
          description: Optional callback URL
      type: object
      required:
      - url
      title: CreateUrlJobRequest
    EditPlan:
      properties:
        prompt:
          type: string
          title: Prompt
          description: Original user prompt
        operations:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Operations
          description: Ordered list of validated operations
        warnings:
          items:
            type: string
          type: array
          title: Warnings
          description: Potential issues, quality warnings, or notes
        requires_confirmation:
          type: boolean
          title: Requires Confirmation
          default: false
        confirmation_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Confirmation Reason
        suggested_repair:
          anyOf:
          - type: string
          - type: 'null'
          title: Suggested Repair
        estimated_duration:
          anyOf:
          - type: number
          - type: 'null'
          title: Estimated Duration
        estimated_dimensions:
          anyOf:
          - prefixItems:
            - type: integer
            - type: integer
            type: array
            maxItems: 2
            minItems: 2
          - type: 'null'
          title: Estimated Dimensions
        timeline:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Timeline
          description: Content-aware timeline model state
        timeline_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Timeline Hash
          description: Deterministic canonical SHA-256 hash of the timeline
        instruction_outcomes:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Instruction Outcomes
          description: Strict 3-way outcomes (APPLIED, NEEDS_CLARIFICATION, REJECTED)
            for each instruction
      type: object
      required:
      - prompt
      title: EditPlan
    EditReceipt:
      properties:
        job_id:
          type: string
          title: Job Id
        created_at:
          type: string
          title: Created At
        completed_at:
          type: string
          title: Completed At
        input_metadata:
          $ref: '#/components/schemas/MediaMetadata'
        output_metadata:
          anyOf:
          - $ref: '#/components/schemas/MediaMetadata'
          - type: 'null'
        user_prompt:
          type: string
          title: User Prompt
        applied_operations:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Applied Operations
        processing_time_seconds:
          type: number
          title: Processing Time Seconds
        warnings:
          items:
            type: string
          type: array
          title: Warnings
        app_version:
          type: string
          title: App Version
          default: 1.0.0
        source_integrity:
          anyOf:
          - $ref: '#/components/schemas/SourceIntegrityInfo'
          - type: 'null'
        timeline:
          anyOf:
