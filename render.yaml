services:
  - type: web
    name: clippilot-ai
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free # Note: Free plan disk is ephemeral. Change to starter if attaching persistent disk.
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000
      - key: CORS_ORIGINS
        value: "*"
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHONUNBUFFERED
        value: "1"
    # Note: On Render's Free tier, disk storage is ephemeral (SQLite and uploads reset on restart).
    # To retain database and videos across redeploys, change plan to 'starter' and uncomment the disk configuration below:
    # disk:
    #   name: clippilot-storage
    #   mountPath: /app/storage
    #   sizeGB: 1
